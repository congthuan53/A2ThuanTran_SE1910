spring.application.name=A2ThuanTran_SE1910

# ===== Database connection (MS SQL Server) =====
# You can override these with environment variables DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:SBA301_Ass2};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
# ddl-auto=update : Hibernate will create/update tables automatically based on entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# keep table/column names exactly as written in @Table/@Column (PascalCase), do not convert to snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# store text columns as NVARCHAR (Unicode) so Vietnamese characters with diacritics are saved correctly
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# ===== JWT (JSON Web Token) for login authentication =====
# jwt.secret must be at least 32 characters long for the HS256 algorithm
jwt.secret=${JWT_SECRET:A2ThuanTran_SE1910_News_Management_Secret_Key_2026}
# token expiration time in milliseconds (default: 8 hours)
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ===== Server =====
server.port=${SERVER_PORT:8080}
